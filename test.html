<!DOCTYPE html>
<html>
<head>
    <title>Uzbek Voice AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            text-align: center;
            margin: 15px;
        }

        #chat {
            background: white;
            padding: 20px;
            border-radius: 10px;
            min-height: 100px;
        }

        .message {
            margin-bottom: 15px;
        }

        .user {
            background: #e8f3ff;
            padding: 12px;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <h1>🎙️ Uzbek Voice AI</h1>

    <div id="status">WebSocket ulanmoqda...</div>

    <button id="startButton">🎤 Gapirishni boshlash</button>

    <div id="chat"></div>


    <script>

        const button = document.getElementById("startButton");
        const chat = document.getElementById("chat");
        const status = document.getElementById("status");


        const socket = new WebSocket("ws://127.0.0.1:8000/ws");


        socket.onopen = function() {

            console.log("WebSocket ulandi!");

            status.innerText = "🟢 WebSocket ulandi";

        };


        socket.onmessage = function(event) {

            console.log("Serverdan javob:", event.data);

            const message = document.createElement("div");

            message.className = "message user";

            message.innerHTML = `
                <strong>🎤 Server:</strong>
                <div>${event.data}</div>
            `;

            chat.appendChild(message);

        };


        socket.onerror = function(error) {

            console.log("WebSocket xato:", error);

            status.innerText = "🔴 WebSocket xato";

        };


        socket.onclose = function() {

            console.log("WebSocket yopildi!");

            status.innerText = "🔴 WebSocket yopildi";

        };


        button.onclick = async function() {

            if (socket.readyState !== WebSocket.OPEN) {

                alert("WebSocket ulanmagan!");

                return;

            }


            const stream = await navigator.mediaDevices.getUserMedia({
                audio: true
            });


            const recorder = new MediaRecorder(stream);


            recorder.ondataavailable = function(event) {

                if (event.data.size > 0) {

                    console.log(
                        "Audio yuborilmoqda:",
                        event.data.size,
                        "bytes"
                    );

                    socket.send(event.data);

                }

            };


            recorder.onstop = function() {

                console.log("Recording to'xtadi");

                stream.getTracks().forEach(
                    track => track.stop()
                );

            };


            recorder.start(1000);


            button.innerText = "🔴 Gapiring...";


            setTimeout(function() {

                recorder.stop();

                button.innerText = "🎤 Gapirishni boshlash";

            }, 5000);

        };

    </script>

</body>
</html>
